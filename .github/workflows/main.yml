name: Generate Snake Contribution Game

on:
  schedule:
    # Executa a cada 12 horas (duas vezes ao dia)
    - cron: "0 */12 * * *"
  workflow_dispatch: # Permite execução manual via botão no GitHub Actions

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    name: Generate Snake Game and Deploy
    steps:
      # Step 1: Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Geração das imagens com Platane/snk@v3
      - name: Generate Snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?palette=github-light
            dist/github-snake.gif?color_snake=#36C5F0&color_dots=#d1e9ff,#91c9ff,#409eff,#2673e0,#1a56b8

      # Step 3: Publica as imagens geradas no branch 'output' via GitHub Pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output         # branch onde as imagens serão salvas
          build_dir: dist              # pasta onde os arquivos gerados estão
          keep_history: false          # limpa o histórico do branch output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token para autenticação

